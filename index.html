<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘 점심 뭐 먹지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#dcebec;--navy:#20303f;--navy-dk:#16242f;
    --blue:#2f6fb0;--blue-dk:#255a90;--card:#fff;--line:#e4edf0;--muted:#8aa0ad;
    --c-han:#2f6fb0;--c-jung:#c0563f;--c-il:#3c7a4f;--c-yang:#9a7240;--c-bun:#c77fa3;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Gothic A1',sans-serif;background:var(--sky);
    display:flex;align-items:center;justify-content:center;padding:46px 22px 30px;
    min-height:100vh;color:var(--navy)}
  .machine{position:relative;width:100%;max-width:410px;background:var(--card);
    border-radius:28px;padding:26px 22px 22px;box-shadow:0 18px 44px rgba(50,90,120,.18)}

  .cloud{position:absolute;background:#fff;border-radius:100px;z-index:-1;
    box-shadow:0 6px 18px rgba(80,120,150,.12)}
  .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
  .cloud.one{width:120px;height:34px;top:-20px;left:24px}
  .cloud.one::before{width:46px;height:46px;top:-22px;left:18px}
  .cloud.one::after{width:60px;height:60px;top:-30px;right:18px}
  .cloud.two{width:96px;height:28px;top:-14px;right:30px}
  .cloud.two::before{width:38px;height:38px;top:-16px;left:14px}
  .cloud.two::after{width:48px;height:48px;top:-22px;right:14px}

  .badge{display:inline-block;background:var(--navy);color:#fff;font-size:12px;font-weight:800;
    letter-spacing:.04em;padding:5px 13px;border-radius:999px;margin-bottom:10px}
  .title{font-size:32px;font-weight:900;line-height:1.05;letter-spacing:-.02em;margin-bottom:16px}
  .title span{color:var(--blue)}

  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
  .chip{font-family:'Gothic A1';font-weight:800;font-size:13px;cursor:pointer;color:var(--muted);
    background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 14px;transition:all .14s}
  .chip:hover{border-color:var(--blue);color:var(--blue)}
  .chip.on{background:var(--navy);border-color:var(--navy);color:#fff}

  .screen{position:relative;background:#f4f8fa;border:2px solid var(--line);border-radius:18px;
    height:172px;margin-bottom:16px;overflow:hidden;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:10px}
  .screen .cat{font-size:12px;font-weight:800;color:#fff;letter-spacing:.04em;padding:3px 12px;
    border-radius:999px;background:var(--blue);opacity:0;transform:translateY(4px);transition:all .25s}
  .screen .pick{font-size:44px;font-weight:900;letter-spacing:-.02em;line-height:1.08;
    text-align:center;padding:0 16px;color:var(--navy)}
  .screen .pick.long{font-size:34px}
  .screen .pick.xlong{font-size:27px}
  .screen.idle .pick{color:var(--muted);font-size:21px;font-weight:800}
  .screen.done{border-color:var(--blue)}
  .screen.done .cat{opacity:1;transform:none}

  .play{width:100%;cursor:pointer;color:#fff;background:var(--blue);font-family:'Gothic A1';
    font-weight:900;font-size:22px;letter-spacing:.02em;border:none;border-radius:16px;padding:15px;
    transition:transform .08s,background .15s;box-shadow:0 6px 0 var(--blue-dk)}
  .play:hover{background:#3479bd}
  .play:active{transform:translateY(4px);box-shadow:0 2px 0 var(--blue-dk)}
  .play:focus-visible{outline:3px solid var(--navy);outline-offset:3px}
  .play:disabled{background:var(--muted);box-shadow:0 6px 0 #6f8794;cursor:default}

  .editbar{margin-top:13px;text-align:center}
  .edittoggle{background:none;border:none;cursor:pointer;font-family:'Gothic A1';font-weight:800;
    font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
  .editor{display:none;margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
  .editor.open{display:block}
  .group{margin-bottom:12px}
  .glabel{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--navy);
    margin-bottom:7px;letter-spacing:.02em}
  .glabel .dot{width:9px;height:9px;border-radius:50%}
  .glabel em{font-style:normal;color:var(--muted);font-weight:700}
  .pool{display:flex;flex-wrap:wrap;gap:6px;min-height:14px}
  .pool .empty{font-size:12px;color:var(--muted);font-weight:600}
  .tag{font-size:12.5px;font-weight:700;color:var(--navy);background:#f4f8fa;border:1.5px solid var(--line);
    border-radius:9px;padding:4px 8px;display:flex;align-items:center;gap:7px}
  .tag .x{cursor:pointer;color:var(--c-jung);font-weight:900;line-height:1}
  .addrow{display:flex;gap:6px;margin-top:14px}
  .addrow input{flex:1;min-width:0;font-family:'Gothic A1';font-weight:600;font-size:13px;color:var(--navy);
    border:2px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
  .addrow input:focus{outline:none;border-color:var(--blue)}
  .addrow select{font-family:'Gothic A1';font-weight:700;font-size:13px;color:var(--navy);
    border:2px solid var(--line);border-radius:10px;padding:0 8px;background:#fff;cursor:pointer}
  .addrow button{font-family:'Gothic A1';font-weight:800;font-size:13px;color:#fff;cursor:pointer;
    background:var(--navy);border:none;border-radius:10px;padding:0 15px}
  @media (prefers-reduced-motion: reduce){.play,.play:active,.screen .cat{transition:none;transform:none}}
</style>
</head>
<body>
  <main class="machine">
    <span class="cloud one"></span><span class="cloud two"></span>

    <span class="badge">오늘의 점심</span>
    <h1 class="title">뭐 먹을까<span>?</span></h1>

    <div class="chips" id="chips"></div>

    <div class="screen idle" id="screen">
      <div class="cat" id="cat"></div>
      <div class="pick" id="pick">뽑기를 눌러봐</div>
    </div>

    <button class="play" id="draw">오늘의 한 끼 뽑기</button>

    <div class="editbar"><button class="edittoggle" id="edittoggle">식당 추가·삭제</button></div>

    <div class="editor" id="editor">
      <div class="groups" id="groups"></div>
      <div class="addrow">
        <input id="newItem" type="text" placeholder="식당 이름" maxlength="20">
        <select id="newCat"></select>
        <button id="addBtn">추가</button>
      </div>
    </div>
  </main>

<script>
const MENU = {
  "한식": ["합정옥","각시보쌈","콩청대","육전국밥","따로집","봄이보리밥","구덕집"],
  "중식": ["연희중식","타오마라탕","백미향","시향","로우샹로우"],
  "일식": ["오레노라멘","크레이지카츠","이리에","카와카츠","쿄다이야우동","스시강","마루돈까스"],
  "양식": ["스케줄","스파카나폴리","피제리아오","몬스터파스타","팔로피자","23플래터"],
  "분식": ["참바른김밥","합정조이떡볶이","마포만두","또보겠지떡볶이","김가네"]
};
const COLOR={"한식":"var(--c-han)","중식":"var(--c-jung)","일식":"var(--c-il)","양식":"var(--c-yang)","분식":"var(--c-bun)"};

const cats=Object.keys(MENU);let active="전체";
const $=id=>document.getElementById(id);
const chipsEl=$('chips'),screen=$('screen'),catEl=$('cat'),pickEl=$('pick'),drawEl=$('draw');
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let drawn=false;

function buildChips(){chipsEl.innerHTML='';
  ["전체",...cats].forEach(c=>{const b=document.createElement('button');
    b.className='chip'+(c===active?' on':'');b.textContent=c;b.onclick=()=>{active=c;buildChips();};
    chipsEl.appendChild(b);});}
const currentPool=()=>active==="전체"
  ? cats.flatMap(c=>MENU[c].map(n=>({name:n,cat:c})))
  : MENU[active].map(n=>({name:n,cat:active}));
function sizeClass(n){pickEl.classList.remove('long','xlong');
  if(n.length>=8)pickEl.classList.add('xlong');else if(n.length>=6)pickEl.classList.add('long');}
function draw(){const pool=currentPool();
  if(!pool.length){screen.className='screen idle';pickEl.textContent='식당을 추가해줘';catEl.textContent='';return;}
  drawEl.disabled=true;screen.className='screen rolling';catEl.textContent='';
  if(reduce){settle(pool[Math.floor(Math.random()*pool.length)]);return;}
  let t=0;const stop=17+Math.floor(Math.random()*6);let d=45;
  (function tick(){const r=pool[Math.floor(Math.random()*pool.length)];
    sizeClass(r.name);pickEl.textContent=r.name;
    if(++t>=stop){settle(r);return;}if(t>stop-6)d+=38;setTimeout(tick,d);})();}
function settle(r){sizeClass(r.name);pickEl.textContent=r.name;
  catEl.textContent=r.cat;catEl.style.background=COLOR[r.cat];
  screen.className='screen done';drawEl.disabled=false;
  if(!drawn){drawEl.textContent='다시 뽑기';drawn=true;}}

const editor=$('editor'),groups=$('groups'),newItem=$('newItem'),newCat=$('newCat');
$('edittoggle').onclick=()=>{editor.classList.toggle('open');renderGroups();};
cats.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;newCat.appendChild(o);});
function renderGroups(){groups.innerHTML='';
  cats.forEach(c=>{const wrap=document.createElement('div');wrap.className='group';
    const h=document.createElement('div');h.className='glabel';
    h.innerHTML='<span class="dot" style="background:'+COLOR[c]+'"></span>'+c+' <em>'+MENU[c].length+'</em>';
    wrap.appendChild(h);
    const pool=document.createElement('div');pool.className='pool';
    if(!MENU[c].length){pool.innerHTML='<span class="empty">없음</span>';}
    else MENU[c].forEach((n,i)=>{const tag=document.createElement('span');tag.className='tag';
      tag.innerHTML='<b></b><span class="x">×</span>';tag.querySelector('b').textContent=n;
      tag.querySelector('.x').onclick=()=>{MENU[c].splice(i,1);renderGroups();};pool.appendChild(tag);});
    wrap.appendChild(pool);groups.appendChild(wrap);});}
function addItem(){const v=newItem.value.trim();if(!v)return;const c=newCat.value;
  if(!MENU[c].includes(v))MENU[c].push(v);newItem.value='';renderGroups();}
$('addBtn').onclick=addItem;
newItem.addEventListener('keydown',e=>{if(e.key==='Enter')addItem();});

drawEl.onclick=draw;buildChips();
</script>
</body>
</html>
